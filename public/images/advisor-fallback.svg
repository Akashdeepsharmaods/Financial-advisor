<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D23"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="350" r="300" fill="url(#rimLight)"/>
  
  <!-- Geometric Luxury Accent Lines -->
  <circle cx="400" cy="380" r="240" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="400" cy="380" r="200" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
  
  <!-- Silhouette / Advisor Figure -->
  <g transform="translate(400, 380)">
    <!-- Head Base -->
    <circle cx="0" cy="-60" r="90" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Shoulders & Bespoke Suit -->
    <path d="M -180 280 C -160 100, -90 50, 0 50 C 90 50, 160 100, 180 280 Z" fill="#0F172A" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>
    <!-- Collar & Tie -->
    <path d="M -35 55 L 0 130 L 35 55 Z" fill="#F8FAFC"/>
    <path d="M -12 110 L 0 240 L 12 110 Z" fill="url(#goldGrad)"/>
    <path d="M -60 70 L 0 260 L -30 260 Z" fill="#070C1E" opacity="0.6"/>
    <path d="M 60 70 L 0 260 L 30 260 Z" fill="#070C1E" opacity="0.6"/>
  </g>

  <!-- Monogram Watermark -->
  <text x="400" y="820" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" letter-spacing="6">VIKRAMADITYA ROY</text>
  <text x="400" y="855" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="3">PRIVATE WEALTH &amp; FAMILY OFFICE</text>
</svg>
